name: Browser tests

# main follows the upstream repo; our work lives on the feat/* branches
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]
  workflow_dispatch:
    inputs:
      server_ref:
        description: "drawdb-server branch or tag to test against"
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: drawdb

      # The API, from its own repo. A private repo needs a token with read
      # access in the SERVER_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/drawdb-server
          ref: ${{ inputs.server_ref || vars.SERVER_REF || 'feat/be-port' }}
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}
          path: drawdb-server

      - name: Start the app
        working-directory: drawdb-server
        run: docker compose -f compose.e2e.yaml up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: drawdb/package-lock.json

      - name: Install
        working-directory: drawdb
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: drawdb
        run: npm run test:e2e

      - name: Server logs
        if: failure()
        working-directory: drawdb-server
        run: docker compose -f compose.e2e.yaml logs server

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            drawdb/playwright-report
            drawdb/test-results
          retention-days: 14
